org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 defaults to its own built-in Kotlin support and a new `android {}`
# DSL, both of which conflict with the explicit org.jetbrains.kotlin.android
# plugin applied by each module. Opt back into the classic, independently
# versioned Kotlin Gradle plugin instead of the newer (and still maturing)
# built-in path.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
